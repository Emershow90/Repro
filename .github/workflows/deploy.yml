name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      skip_verification:
        description: 'Pular typecheck/lint/test (apenas build + deploy)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-prod'
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        # --ignore-scripts pula compilação nativa do odbc (não é usada no cliente)
        run: npm ci --ignore-scripts

      - name: Validate lockfile
        run: npm run validate:lock

      - name: Typecheck
        if: ${{ !inputs.skip_verification }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !inputs.skip_verification }}
        run: npm run lint

      - name: Test
        if: ${{ !inputs.skip_verification }}
        run: npm test

      - name: Build web
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          VITE_SHEETS_DEFAULT_URL: ${{ secrets.VITE_SHEETS_DEFAULT_URL }}
          VITE_SHEETS_LEGACY_MARKER: ${{ secrets.VITE_SHEETS_LEGACY_MARKER }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verify build output
        run: |
          if [ ! -f dist/404.html ]; then
            echo "❌ dist/404.html ausente — SPA routing vai quebrar"
            exit 1
          fi
          REPO="${{ github.event.repository.name }}"
          if ! grep -q "/${REPO}/assets" dist/index.html; then
            echo "❌ Assets não usam base path /${REPO}/"
            grep -o 'src="[^"]*"' dist/index.html | head -3 || true
            exit 1
          fi
          echo "✅ Build OK"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # cria o Pages site se não existir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Testando $URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deploy OK (tentativa $i)"
              exit 0
            fi
            echo "Tentativa $i: HTTP $STATUS — aguardando 5s..."
            sleep 5
          done
          echo "❌ Deploy não respondeu 200 após 60s"
          exit 1
