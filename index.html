<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal REPRO</title>
    <meta name="description" content="Terminal REPRO v5.0: Sistema de alta produtividade intralogística com apontamento de reabastecimento por rua, cálculo de média/endereço, EPH/VPH, consolidação operacional e auditoria completa." />
    <meta property="og:title" content="Terminal REPRO" />
    <meta property="og:description" content="Terminal REPRO v5.0: Sistema de alta produtividade intralogística com apontamento de reabastecimento por rua, cálculo de média/endereço, EPH/VPH, consolidação operacional e auditoria completa." />
    
    <!-- Preconnect & Google Fonts for crisp typography across all devices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script>
      // Clear any obsolete service workers safely without forcing continuous page reload
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            registration.unregister();
          }
        }).catch(err => console.warn('Service worker cleanup:', err));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
