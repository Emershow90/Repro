<!doctype html>
<html lang="pt-PT" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal REPRO</title>
    <meta name="description" content="Terminal REPRO v5.0: Sistema de alta produtividade intralogística com apontamento de reabastecimento por rua, cálculo de média/endereço, EPH/VPH, consolidação operacional e auditoria completa." />
    <meta property="og:title" content="Terminal REPRO" />
    <meta property="og:description" content="Terminal REPRO v5.0: Sistema de alta produtividade intralogística com apontamento de reabastecimento por rua, cálculo de média/endereço, EPH/VPH, consolidação operacional e auditoria completa." />
    <script>
      // Clear any service workers that might be intercepting and causing "Resource was not cached" errors
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            registration.unregister().then(success => {
              if (success) {
                console.log('Unregistered stale service worker successfully.');
                window.location.reload();
              }
            });
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
